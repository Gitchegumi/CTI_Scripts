services:
  # Trading engine: market data, scanning, signals, alerts, metric/journal
  # writes. No public HTTP port. Publishes a JSON-safe runtime snapshot to Redis
  # for the API/dashboard to read. A crash here restarts only this container.
  tradegumi-worker:
    image: ghcr.io/gitchegumi/cti-scripts:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: python
    # Default image ENTRYPOINT is entrypoint.worker.sh (the trading loop).
    env_file:
      - .env
    volumes:
      - tradegumi-data:/app/src/tradegumi/data
    restart: unless-stopped
    # The worker has no HTTP port; health is the freshness of its Redis heartbeat.
    healthcheck:
      test: ["CMD", "python", "-m", "tradegumi.healthcheck", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # HTTP API service: analytics + control on port 8199. Reads hot state from the
  # worker's Redis snapshot + the shared data volume (read-only) and durable
  # analytics from Postgres. Builds its own read-only execution client; never
  # places orders.
  tradegumi-api:
    image: ghcr.io/gitchegumi/cti-scripts:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: python
    entrypoint: ["/entrypoint.api.sh"]
    ports:
      - "8199:8199"  # API server
    env_file:
      - .env
    volumes:
      # Read-only: the API serves worker-produced state files but never writes them.
      - tradegumi-data:/app/src/tradegumi/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8199/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tradegumi-dashboard:
    image: ghcr.io/gitchegumi/cti-scripts-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
      args:
        # Baked into client bundles at build time.
        NEXT_PUBLIC_API_URL: http://tradegumi-api:8199
    ports:
      - "3000:3000"  # Dashboard UI
    env_file:
      - .env
    environment:
      # The dashboard's Next server proxies /api/* to the standalone API service.
      NEXT_PUBLIC_API_URL: http://tradegumi-api:8199
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      tradegumi-api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradegumi
      POSTGRES_PASSWORD: ${TRADEGUMI_POSTGRES_PASSWORD:-tradegumi}
      POSTGRES_DB: tradegumi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegumi -d tradegumi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  tradegumi-data:
  postgres-data:
  redis-data:
