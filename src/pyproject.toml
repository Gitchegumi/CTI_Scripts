[tool.poetry]
name = "cti_scripts"
version = "0.2.0"
description = "CTI prop firm trading tools — signal engine (TradeGumi), legacy scripts. Backtesting/research lives in QuantPipe."
authors = ["Gitchegumi <mat@gitchegumi.com>"]
readme = "README.md"
packages = [{ include = "tradegumi" }, { include = "trading_scripts" }]

[tool.poetry.dependencies]
python = "^3.13"
selenium = "^4.27.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
cloudscraper = "^1.2.71"
pandas = "^2.2.3"
ta-lib = ">=0.6.3"
pandas-ta = "^0.4.71b0"
setuptools = ">=78.1,<83.0"
numpy = ">=2.2.6"
matplotlib = "^3.10.0"
pytz = ">=2024.1"
discord-py = "^2.4"
psycopg = {version = "^3.3", extras = ["binary"]}
redis = {version = ">=5.2,<9.0", extras = ["hiredis"]}
fastapi = ">=0.115,<1.0"
uvicorn = {version = ">=0.34,<1.0", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.4,<10.0.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"