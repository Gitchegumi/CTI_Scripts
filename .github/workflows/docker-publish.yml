name: Docker Build and Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cti-scripts
  DASHBOARD_IMAGE_NAME: ${{ github.repository_owner }}/cti-scripts-dashboard

jobs:
  # Lightweight build-only check on PRs — catches Dockerfile breakage before merge
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile is multi-target: build each image explicitly so neither
      # is silently published as the wrong stage.
      - name: Validate python image (worker + api)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: python
          push: false
          cache-from: type=gha
      - name: Validate dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: false
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'http://tradegumi-api:8199' }}

  # Decide whether a release is due and what the next version is, WITHOUT
  # creating anything. semantic-release (conventionalcommits) only reports a
  # version for fix (patch), feat (minor), or breaking (major) commits; any
  # other commit type leaves new_release_published=false and short-circuits the
  # build + release jobs below.
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release verifyConditions checks push access, even in dry run
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      major: ${{ steps.semantic.outputs.new_release_major_version }}
      minor: ${{ steps.semantic.outputs.new_release_minor_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for semver calculation

      - name: Compute next version (dry run — no tag or release created)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Calculate version, build, and push images — runs only when a release is due.
  # The git tag / GitHub release is NOT created here.
  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose v-prefixed image tags
        id: tags
        run: |
          echo "full=v${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "minor=v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}" >> $GITHUB_OUTPUT
          echo "major=v${{ needs.version.outputs.major }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (python image — worker + api)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.full }}
            type=raw,value=${{ steps.tags.outputs.minor }}
            type=raw,value=${{ steps.tags.outputs.major }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push python image (worker + api)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (dashboard image)
        id: meta_dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.full }}
            type=raw,value=${{ steps.tags.outputs.minor }}
            type=raw,value=${{ steps.tags.outputs.major }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: true
          tags: ${{ steps.meta_dashboard.outputs.tags }}
          labels: ${{ steps.meta_dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'http://tradegumi-api:8199' }}

  # Create the git tag and GitHub release only after the images are published.
  release:
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for semver calculation

      - name: Semantic Release (create tag + GitHub release)
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Docker images published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Python image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard image:** \`${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}:v${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
