[tool.poetry]
name = "trading_scripts"
version = "0.1.1"
description = "This is a python script to automate trailing my stop-loss in the CTI match-trader platform"
authors = ["Gitchegumi <mat@gitchegumi.com>"]
readme = "README.md"
packages = [{ include = "trading_scripts" }]

[tool.poetry.dependencies]
python = "^3.13"
selenium = "^4.27.1"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
cloudscraper = "^1.2.71"
pandas = "^2.2.3"
ta-lib = ">=0.6.3"
setuptools = "^78.1.0"
numpy = ">=2.2.6"
backtrader = "^1.9.78.123"
matplotlib = "^3.10.0"
pandas-ta = "^0.4.71b0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"


[tool.poetry.group.back_testing.dependencies]
plotly = "^6.0.1"
matplotlib = "^3.10.0"
nbformat = "^5.10.4"
ipympl = "^0.9.6"
backtrader = "^1.9.78.123"
beautifulsoup4 = "^4.12.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
